[package]
name = "voicefox-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[[bin]]
name = "voicefox-gui"
path = "src/main.rs"

[[bin]]
name = "voicefox-gui-demo"
path = "src/bin/voicefox-gui-demo.rs"

[dev-dependencies]
tokio.workspace = true
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }

[dependencies]
lx-core = { path = "../core" }
lx-player = { path = "../player" }
lx-lyric = { path = "../lyric" }
lx-source = { path = "../source" }
voicefox-application = { path = "../application" }
voicefox-runtime = { path = "../runtime" }

tokio.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
image.workspace = true
tracing.workspace = true
toml.workspace = true
base64.workspace = true
qrcode = { version = "0.4", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# 系统托盘：纯 Rust StatusNotifierItem（走 D-Bus，与 MPRIS 同一条路线，
# 不引入 GTK/xdo 构建链），阻塞版自带线程。
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

[features]
default = ["desktop-mpv"]
desktop-mpv = ["voicefox-runtime/desktop-mpv"]
